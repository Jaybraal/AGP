<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGP — Iniciar Sesión</title>
  <script src="/static/js/tailwind.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center font-sans">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-3xl mx-auto mb-4 shadow-lg">A</div>
      <h1 class="text-2xl font-bold text-slate-800">AGP</h1>
      <p class="text-slate-400 text-sm">Sistema de Gestión de Préstamos</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">

      {% if error %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm font-medium">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="space-y-4">

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
            <input type="text" name="usuario" value="{{ usuario or '' }}" autofocus autocomplete="username"
                   class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <input type="password" name="password" autocomplete="current-password"
                   class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>

          <button type="submit"
                  class="w-full py-2.5 bg-blue-600 text-white rounded-lg font-semibold text-sm hover:bg-blue-700 transition-colors mt-2">
            Iniciar Sesión
          </button>

        </div>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">AGP v1.0</p>
  </div>

</body>
</html>
