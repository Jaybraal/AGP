name: Build y Release AGP

on:
  workflow_dispatch:        # permite lanzarlo manualmente desde GitHub
  push:
    tags:
      - 'v*'               # se ejecuta automáticamente al crear un tag v1.0, v1.1, etc.

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar para Windows
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install flask python-dateutil fpdf2 openpyxl PyQt6 PyQt6-WebEngine pyinstaller pyinstaller-hooks-contrib

      - name: Compilar con PyInstaller
        run: pyinstaller AGP-web-windows.spec

      - name: Verificar contenido dist
        run: Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName | Select-Object -First 20

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compilar instalador con Inno Setup
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc AGP-installer.iss
        shell: pwsh

      - name: Verificar que el instalador existe
        run: |
          if (Test-Path "AGP-Installer.exe") {
            Write-Host "OK - AGP-Installer.exe generado correctamente"
            (Get-Item "AGP-Installer.exe").Length / 1MB | ForEach-Object { Write-Host "Tamaño: $([math]::Round($_, 1)) MB" }
          } else {
            Write-Host "ERROR - No se encontró AGP-Installer.exe"
            exit 1
          }
        shell: pwsh

      - name: Determinar tag de versión
        id: version
        run: |
          if ("${{ github.ref_name }}" -match "^v") {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=v1.0-beta" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Crear Release y subir instalador
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AGP Sistema ${{ steps.version.outputs.tag }}
          body: |
            ## AGP — Sistema de Gestión de Préstamos

            ### Instalación en Windows
            1. Descarga **AGP-Installer.exe**
            2. Doble clic → siguiente → siguiente → listo
            3. Abre la app desde el ícono en el Escritorio

            > No requiere instalar Python, navegador ni ninguna dependencia adicional.
          files: AGP-Installer.exe
          draft: false
          prerelease: false
