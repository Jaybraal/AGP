name: Build y Release AGP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar para Windows
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install flask python-dateutil fpdf2 openpyxl Pillow werkzeug itsdangerous markupsafe click blinker pyinstaller pyinstaller-hooks-contrib

      - name: Convertir icono PNG a ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('assets/icon.png')
          img.save('assets/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          print('Icono OK')
          "

      - name: Compilar con PyInstaller
        run: pyinstaller AGP-web-windows.spec

      - name: Mostrar warnings de PyInstaller
        run: |
          $warn = "build\AGP-web-windows\warn-AGP-web-windows.txt"
          if (Test-Path $warn) { Get-Content $warn | Select-Object -First 60 }
        shell: pwsh

      - name: Verificar exe generado
        run: |
          if (Test-Path "dist\AGP\AGP.exe") {
            Write-Host "OK - AGP.exe generado"
            (Get-Item "dist\AGP\AGP.exe").Length / 1MB | ForEach-Object { Write-Host "Tamaño: $([math]::Round($_, 1)) MB" }
          } else {
            Write-Host "ERROR - No se encontró AGP.exe"
            Get-ChildItem -Recurse dist
            exit 1
          }
        shell: pwsh

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compilar instalador con Inno Setup
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          & $iscc /DAppVersion=$tag AGP-installer.iss
        shell: pwsh

      - name: Verificar instalador
        run: |
          if (Test-Path "AGP-Installer.exe") {
            Write-Host "OK - Instalador generado"
            (Get-Item "AGP-Installer.exe").Length / 1MB | ForEach-Object { Write-Host "Tamaño: $([math]::Round($_, 1)) MB" }
          } else {
            Write-Host "ERROR - No se generó el instalador"
            exit 1
          }
        shell: pwsh

      - name: Determinar tag
        id: version
        run: |
          if ("${{ github.ref_name }}" -match "^v") {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=v1.0" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AGP Sistema ${{ steps.version.outputs.tag }}
          body: |
            ## AGP — Sistema de Gestión de Préstamos

            ### Instalación
            1. Descarga **AGP-Installer.exe**
            2. Doble clic → siguiente → siguiente → listo
            3. La app abre sola en su propia ventana

            Compatible con Windows 10 y Windows 11.
          files: AGP-Installer.exe
          draft: false
          prerelease: false
