name: Build y Release AGP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Crear Release (ZIP)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Determinar versión
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0" >> $GITHUB_OUTPUT
          fi

      - name: Crear ZIP del proyecto
        run: |
          mkdir -p agp_release
          # Copiar solo los archivos necesarios para ejecutar (no .git, no __pycache__, etc.)
          rsync -av \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='*.spec' \
            --exclude='*.zip' \
            --exclude='*.app' \
            --exclude='venv' \
            --exclude='.DS_Store' \
            . agp_release/AGP/
          cd agp_release
          zip -r AGP-Windows.zip AGP/
          ls -lh AGP-Windows.zip

      - name: Crear Release y subir ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AGP Sistema ${{ steps.version.outputs.tag }}
          body: |
            ## AGP — Sistema de Gestión de Préstamos ${{ steps.version.outputs.tag }}

            ### Instalación en Windows (solo la primera vez)

            **Requisito previo:** tener Python instalado.
            Si no lo tienes: https://www.python.org/downloads/
            *(durante la instalación marca "Add Python to PATH")*

            ### Pasos:
            1. Descarga **AGP-Windows.zip** y extráelo (clic derecho → Extraer todo)
            2. Entra a la carpeta `AGP`
            3. Doble clic en **instalar_windows.bat** → espera que termine
            4. Listo — queda un ícono **"AGP Sistema de Prestamos"** en el Escritorio

            ### Uso diario:
            Doble clic en el ícono del Escritorio. La app abre en una ventana propia.

            ### Actualizar a nueva versión:
            Descarga el nuevo ZIP, extráelo en la misma carpeta (reemplaza los archivos),
            y vuelve a ejecutar **instalar_windows.bat**.
          files: agp_release/AGP-Windows.zip
          draft: false
          prerelease: false
